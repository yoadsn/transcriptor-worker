[project]
name = "transcriptor-worker"
version = "0.1.0"
description = "Handwriting OCR data processing pipeline worker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "pymupdf",
    "surya-ocr",
    "pillow",
    "azure-ai-documentintelligence>=1.0.2",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
transcriptor-worker = "transcriptor_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriptor_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
